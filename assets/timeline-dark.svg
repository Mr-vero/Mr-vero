tyle="fill:#F1F5F9">104</text><text x="743.3" y="426" text-anchor="middle" class="stage">2022</text><rect x="817.6" y="372.6" width="57.8" height="27.4" rx="5" fill="url(#gv)" fill-opacity="0.43"/><text x="846.5" y="362.6" text-anchor="middle" class="chip" style="fill:#F1F5F9">337</text><text x="846.5" y="426" text-anchor="middle" class="stage">2023</text><text x="817.6" y="338.6" text-anchor="start" class="accent" style="letter-spacing:0.5px;text-transform:none;font-weight:600">AI bots</text><rect x="920.9" y="331.8" width="57.8" height="68.2" rx="5" fill="url(#gv)" fill-opacity="0.54"/><text x="949.8" y="321.8" text-anchor="middle" class="chip" style="fill:#F1F5F9">839</text><text x="949.8" y="426" text-anchor="middle" class="stage">2024</text><text x="920.9" y="297.8" text-anchor="start" class="accent" style="letter-spacing:0.5px;text-transform:none;font-weight:600">AI products</text><rect x="1024.2" y="170.0" width="57.8" height="230.0" rx="5" fill="url(#gv)" fill-opacity="1.00"/><text x="1053.1" y="160.0" text-anchor="middle" class="chip" style="fill:#F1F5F9">2,829</text><text x="1053.1" y="426" text-anchor="middle" class="stage">2025</text><text x="1082.0" y="136.0" text-anchor="end" class="accent" style="letter-spacing:0.5px;text-transform:none;font-weight:600">Peak year</text><rect x="1127.4" y="246.3" width="57.8" height="153.7" rx="5" fill="url(#gv)" fill-opacity="0.78"/><text x="1156.4" y="236.3" text-anchor="middle" class="chip" style="fill:#F1F5F9">1,891</text><text x="1156.4" y="426" text-anchor="middle" class="stage">2026*</text>
<text x="1208" y="452" text-anchor="end" class="chip" style="font-size:11px">* 2026 through early November · source: GitHub contribution graph</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="469" rx="18" fill="none" stroke="#1E293B"/>
</svg>
