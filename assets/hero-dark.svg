<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Irvan, end-to-end product engineer">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5EEAD4"/><stop offset="0.55" stop-color="#A78BFA"/><stop offset="1" stop-color="#FBBF24"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
  </pattern>
  <radialGradient id="glowA"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
  <style>
    .mono{font:500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#64748B}
    .name{font:800 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-2.5px}
    .head{font:650 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9;letter-spacing:-0.5px}
    .sub{font:400 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
    .stage{font:600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#94A3B8;letter-spacing:0.5px;text-transform:uppercase}
    .num{font:750 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9;letter-spacing:-0.5px}
    .lbl{font:400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
    .caret{animation:blink 1.1s steps(1) infinite}
    .flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
    .n{animation:pulse 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .glow{animation:drift 12s ease-in-out infinite alternate}
    @keyframes blink{50%{opacity:0}}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes pulse{0%,70%,100%{transform:scale(1)}35%{transform:scale(2.2)}}
    @keyframes drift{to{transform:translate(-60px,30px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1280" height="470" rx="18" fill="#0A0E16"/>
<rect width="1280" height="470" rx="18" fill="url(#grid)"/>
<circle class="glow" cx="1060" cy="90" r="320" fill="url(#glowA)"/>
<circle class="glow" cx="300" cy="420" r="260" fill="url(#glowB)" style="animation-delay:-6s"/>

<text x="72" y="78" class="mono">irvan@build:~$ <tspan fill="#F1F5F9">ship --from idea --to production</tspan><tspan class="caret" fill="#5EEAD4"> ▍</tspan></text>
<text x="68" y="166" class="name" fill="url(#g)">Irvan</text>
<text x="72" y="214" class="head">One engineer. The whole product lifecycle.</text>
<text x="72" y="250" class="sub">AI systems, native macOS &amp; Android apps, web platforms, frameworks and games:</text>
<text x="72" y="276" class="sub">designed, built, secured and shipped end to end.</text>

<line x1="72" y1="336" x2="1208" y2="336" stroke="#1E293B" stroke-width="2"/>
<line x1="72" y1="336" x2="1208" y2="336" stroke="url(#g)" stroke-width="2" class="flow"/>
<circle r="5" fill="#FBBF24"><animateMotion dur="7s" repeatCount="indefinite" path="M72,336 H1208"/></circle>
<circle cx="72.0" cy="336" r="7" fill="#0A0E16" stroke="url(#g)" stroke-width="2.5"/><circle cx="72.0" cy="336" r="2.5" fill="url(#g)" class="n" style="animation-delay:0.0s"/><circle cx="261.3" cy="336" r="7" fill="#0A0E16" stroke="url(#g)" stroke-width="2.5"/><circle cx="261.3" cy="336" r="2.5" fill="url(#g)" class="n" style="animation-delay:0.5s"/><circle cx="450.7" cy="336" r="7" fill="#0A0E16" stroke="url(#g)" stroke-width="2.5"/><circle cx="450.7" cy="336" r="2.5" fill="url(#g)" class="n" style="animation-delay:1.0s"/><circle cx="640.0" cy="336" r="7" fill="#0A0E16" stroke="url(#g)" stroke-width="2.5"/><circle cx="640.0" cy="336" r="2.5" fill="url(#g)" class="n" style="animation-delay:1.5s"/><circle cx="829.3" cy="336" r="7" fill="#0A0E16" stroke="url(#g)" stroke-width="2.5"/><circle cx="829.3" cy="336" r="2.5" fill="url(#g)" class="n" style="animation-delay:2.0s"/><circle cx="1018.7" cy="336" r="7" fill="#0A0E16" stroke="url(#g)" stroke-width="2.5"/><circle cx="1018.7" cy="336" r="2.5" fill="url(#g)" class="n" style="animation-delay:2.5s"/><circle cx="1208.0" cy="336" r="7" fill="#0A0E16" stroke="url(#g)" stroke-width="2.5"/><circle cx="1208.0" cy="336" r="2.5" fill="url(#g)" class="n" style="animation-delay:3.0s"/>
<text x="72.0" y="368" text-anchor="start" class="stage">Idea</text><text x="261.3" y="368" text-anchor="middle" class="stage">Architecture</text><text x="450.7" y="368" text-anchor="middle" class="stage">Build</text><text x="640.0" y="368" text-anchor="middle" class="stage">Test</text><text x="829.3" y="368" text-anchor="middle" class="stage">Security</text><text x="1018.7" y="368" text-anchor="middle" class="stage">Ship</text><text x="1208.0" y="368" text-anchor="end" class="stage">Operate</text>
<line x1="72" y1="394" x2="1208" y2="394" stroke="#1E293B"/>
<text x="72.0" y="436"><tspan class="num">10+</tspan><tspan class="lbl" dx="8">years shipping</tspan></text><text x="299.2" y="436"><tspan class="num">6,400+</tspan><tspan class="lbl" dx="8">contributions</tspan></text><text x="526.4" y="436"><tspan class="num">360+</tspan><tspan class="lbl" dx="8">repositories</tspan></text><text x="753.6" y="436"><tspan class="num">8</tspan><tspan class="lbl" dx="8">languages</tspan></text><text x="980.8" y="436"><tspan class="num">5</tspan><tspan class="lbl" dx="8">platforms</tspan></text>
</svg>
