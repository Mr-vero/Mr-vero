<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Selected work: 8 products, built and shipped solo">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0D9488"/><stop offset="0.55" stop-color="#7C3AED"/><stop offset="1" stop-color="#D97706"/>
  </linearGradient>
  <linearGradient id="gv" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#0D9488"/><stop offset="0.6" stop-color="#7C3AED"/><stop offset="1" stop-color="#D97706"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0F172A" stroke-opacity="0.05"/>
  </pattern>
  <radialGradient id="glow_a"><stop offset="0" stop-color="#0D9488" stop-opacity="0.18"/><stop offset="1" stop-color="#0D9488" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow_b"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.18"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow_c"><stop offset="0" stop-color="#D97706" stop-opacity="0.18"/><stop offset="1" stop-color="#D97706" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1280" height="150" rx="18"/></clipPath>
  <style>
    .mono{font:500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#64748B}
    .eyebrow{font:600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#64748B;letter-spacing:1.5px;text-transform:uppercase}
    .accent{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#7C3AED;letter-spacing:1.5px;text-transform:uppercase}
    .name{font:800 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-2.5px}
    .h2{font:750 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#0F172A;letter-spacing:-1px}
    .title{font:800 36px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-1px}
    .head{font:650 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#0F172A;letter-spacing:-0.5px}
    .sub{font:400 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#475569}
    .body{font:400 16.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#0F172A}
    .small{font:400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#475569}
    .strong{font:650 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#0F172A}
    .chip{font:500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#475569}
    .pill{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1px;text-transform:uppercase}
    .stage{font:600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#475569;letter-spacing:0.5px;text-transform:uppercase}
    .num{font:750 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#0F172A;letter-spacing:-0.5px}
    .bignum{font:800 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-2px}
    .lbl{font:400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#475569}
    .caret{animation:blink 1.1s steps(1) infinite}
    .flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
    .n{animation:pulse 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .glow{animation:drift 12s ease-in-out infinite alternate}
    .rise{transform-box:fill-box;transform-origin:bottom;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
    @keyframes blink{50%{opacity:0}}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes pulse{0%,70%,100%{transform:scale(1)}35%{transform:scale(2.2)}}
    @keyframes drift{to{transform:translate(-60px,30px)}}
    @keyframes rise{from{transform:scaleY(0)}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="150" fill="#FAFBFD"/>
<rect width="1280" height="150" fill="url(#grid)"/>
<circle class="glow" cx="1152" cy="75" r="220" fill="url(#glow_b)" style="animation-delay:0s"/><circle class="glow" cx="64" cy="180" r="160" fill="url(#glow_a)" style="animation-delay:-6s"/>

<text x="72" y="58" class="eyebrow"><tspan fill="url(#g)" style="fill:#7C3AED">01</tspan>  ──  8 products, built and shipped solo</text>
<text x="70" y="108" class="h2">Selected work</text>
<line x1="860" y1="92" x2="1208" y2="92" stroke="#E2E8F0" stroke-width="2"/><line x1="860" y1="92" x2="1208" y2="92" stroke="url(#g)" stroke-width="2" class="flow"/><circle r="5" fill="#D97706"><animateMotion dur="7s" repeatCount="indefinite" path="M860,92 H1208"/></circle><circle cx="860.0" cy="92" r="7" fill="#FAFBFD" stroke="url(#g)" stroke-width="2.5"/><circle cx="860.0" cy="92" r="2.5" fill="url(#g)" class="n" style="animation-delay:0.0s"/><circle cx="947.0" cy="92" r="7" fill="#FAFBFD" stroke="url(#g)" stroke-width="2.5"/><circle cx="947.0" cy="92" r="2.5" fill="url(#g)" class="n" style="animation-delay:0.5s"/><circle cx="1034.0" cy="92" r="7" fill="#FAFBFD" stroke="url(#g)" stroke-width="2.5"/><circle cx="1034.0" cy="92" r="2.5" fill="url(#g)" class="n" style="animation-delay:1.0s"/><circle cx="1121.0" cy="92" r="7" fill="#FAFBFD" stroke="url(#g)" stroke-width="2.5"/><circle cx="1121.0" cy="92" r="2.5" fill="url(#g)" class="n" style="animation-delay:1.5s"/><circle cx="1208.0" cy="92" r="7" fill="#FAFBFD" stroke="url(#g)" stroke-width="2.5"/><circle cx="1208.0" cy="92" r="2.5" fill="url(#g)" class="n" style="animation-delay:2.0s"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="149" rx="18" fill="none" stroke="#E2E8F0"/>
</svg>
