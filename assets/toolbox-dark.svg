<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Toolbox: Languages: TypeScript, JavaScript, Python, Swift, Kotlin, PHP, Ruby, Objective-C; AI: RAG, Hybrid search, Reranking, LLM evals, Agents, Voice AI, Claude, MediaPipe; Platforms: macOS · SwiftUI, AppKit, Android · CameraX, IME, PWA, Canvas, Web Audio, Node.js; Data + infra: PostgreSQL, pgvector, SQLite FTS5, GitHub Actions, Vercel, GitHub Pages">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5EEAD4"/><stop offset="0.55" stop-color="#A78BFA"/><stop offset="1" stop-color="#FBBF24"/>
  </linearGradient>
  <linearGradient id="gv" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#5EEAD4"/><stop offset="0.6" stop-color="#A78BFA"/><stop offset="1" stop-color="#FBBF24"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
  </pattern>
  <radialGradient id="glow_a"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow_b"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow_c"><stop offset="0" stop-color="#FBBF24" stop-opacity="0.35"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
  <clipPath id="clip"><rect width="1280" height="360" rx="18"/></clipPath>
  <style>
    .mono{font:500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#64748B}
    .eyebrow{font:600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#64748B;letter-spacing:1.5px;text-transform:uppercase}
    .accent{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#A78BFA;letter-spacing:1.5px;text-transform:uppercase}
    .name{font:800 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-2.5px}
    .h2{font:750 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9;letter-spacing:-1px}
    .title{font:800 36px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-1px}
    .head{font:650 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9;letter-spacing:-0.5px}
    .sub{font:400 19px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
    .body{font:400 16.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9}
    .small{font:400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
    .strong{font:650 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9}
    .chip{font:500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#94A3B8}
    .pill{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1px;text-transform:uppercase}
    .stage{font:600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#94A3B8;letter-spacing:0.5px;text-transform:uppercase}
    .num{font:750 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9;letter-spacing:-0.5px}
    .bignum{font:800 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;letter-spacing:-2px}
    .lbl{font:400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
    .caret{animation:blink 1.1s steps(1) infinite}
    .flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
    .n{animation:pulse 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .glow{animation:drift 12s ease-in-out infinite alternate}
    .rise{transform-box:fill-box;transform-origin:bottom;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
    @keyframes blink{50%{opacity:0}}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes pulse{0%,70%,100%{transform:scale(1)}35%{transform:scale(2.2)}}
    @keyframes drift{to{transform:translate(-60px,30px)}}
    @keyframes rise{from{transform:scaleY(0)}}
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="#0A0E16"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle class="glow" cx="1216" cy="72" r="240" fill="url(#glow_c)" style="animation-delay:0s"/><circle class="glow" cx="64" cy="360" r="220" fill="url(#glow_b)" style="animation-delay:-6s"/>

<text x="72" y="58" class="eyebrow"><tspan style="fill:#A78BFA">04</tspan>  ──  Toolbox</text>
<text x="70" y="102" class="h2" style="font-size:34px">The right tool for each layer.</text>
<line x1="72" y1="128" x2="1208" y2="128" stroke="#1E293B"/>
