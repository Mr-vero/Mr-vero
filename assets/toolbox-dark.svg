roke="#273244"/><text x="752.6" y="222" class="chip">Voice AI</text><rect x="839.9" y="202" width="73.2" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="850.9" y="222" class="chip">Claude</text><rect x="921.2" y="202" width="98.9" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="932.2" y="222" class="chip">MediaPipe</text><text x="72" y="272" class="eyebrow">Platforms</text><rect x="250.0" y="252" width="150.1" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="261.0" y="272" class="chip">macOS · SwiftUI</text><rect x="408.1" y="252" width="73.2" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="419.1" y="272" class="chip">AppKit</text><rect x="489.3" y="252" width="167.2" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="500.3" y="272" class="chip">Android · CameraX</text><rect x="664.5" y="252" width="47.6" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="675.5" y="272" class="chip">IME</text><rect x="720.1" y="252" width="47.6" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="731.1" y="272" class="chip">PWA</text><rect x="775.8" y="252" width="73.2" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="786.8" y="272" class="chip">Canvas</text><rect x="857.0" y="252" width="98.9" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="868.0" y="272" class="chip">Web Audio</text><rect x="963.9" y="252" width="81.8" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="974.9" y="272" class="chip">Node.js</text><text x="72" y="322" class="eyebrow">Data + infra</text><rect x="250.0" y="302" width="107.4" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="261.0" y="322" class="chip">PostgreSQL</text><rect x="365.4" y="302" width="90.3" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="376.4" y="322" class="chip">pgvector</text><rect x="463.7" y="302" width="115.9" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="474.7" y="322" class="chip">SQLite FTS5</text><rect x="587.7" y="302" width="141.6" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="598.7" y="322" class="chip">GitHub Actions</text><rect x="737.2" y="302" width="73.2" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="748.2" y="322" class="chip">Vercel</text><rect x="818.5" y="302" width="124.5" height="28" rx="7" fill="#111827" stroke="#273244"/><text x="829.5" y="322" class="chip">GitHub Pages</text>
</g>
